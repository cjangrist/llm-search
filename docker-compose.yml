services:
  llm-search:
    image: ghcr.io/cjangrist/llm-search:latest
    build:
      context: .
      args:
        # Match the container user to the host UID so bind-mounted creds + the
        # logs mount are read/writable. Defaults to 1000 when HOST_UID is unset.
        HOST_UID: ${HOST_UID:-1000}
    restart: unless-stopped
    ports:
      # Bind to localhost only — anyone reachable on 0.0.0.0 could drain provider quotas
      # and (with the codex CLI sandbox bypass) exfiltrate credentials. Same-host clients
      # still reach localhost:8041; cross-host access requires an explicit reverse proxy.
      - "127.0.0.1:8041:8080"
    environment:
      - KIMI_API_KEY
    volumes:
      # Direct writable directory mounts preserve CLI logins and atomic token
      # rotations on the host across restarts and image rebuilds.
      - ~/.claude:/home/llmsearch/.claude
      - ~/.codex:/home/llmsearch/.codex
      - ~/.gemini:/home/llmsearch/.gemini
      - ~/.kimi:/home/llmsearch/.kimi
      - ~/.grok:/home/llmsearch/.grok
      - ~/logs/llm-search:/tmp/llm-search/logs
