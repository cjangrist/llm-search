services:
  llm-search:
    image: ghcr.io/cjangrist/llm-search:latest
    build:
      context: .
      args:
        # Match the container user to the host UID so bind-mounted creds + the
        # logs mount are read/writable. Defaults to 1000 when HOST_UID is unset.
        HOST_UID: ${HOST_UID:-1000}
    restart: unless-stopped
    ports:
      # Bind to localhost only — anyone reachable on 0.0.0.0 could drain provider quotas
      # and (with the codex CLI sandbox bypass) exfiltrate credentials. Same-host clients
      # still reach localhost:8041; cross-host access requires an explicit reverse proxy.
      - "127.0.0.1:8041:8080"
    environment:
      - KIMI_API_KEY
    volumes:
      # Mount each CLI's home directory (RO) instead of individual files so that
      # atomic-rename token rotations on the host (claude, codex, etc.) are followed.
      # File bind-mounts capture the inode at startup and do NOT track host renames,
      # which causes container creds to go stale after the next refresh.
      - ~/.claude:/mnt/creds/claude:ro
      - ~/.codex:/mnt/creds/codex:ro
      - ~/.gemini:/mnt/creds/gemini:ro
      - ~/.kimi:/mnt/creds/kimi:ro
      - ~/.grok:/mnt/creds/grok:ro
      - ~/logs/llm-search:/tmp/llm-search/logs
