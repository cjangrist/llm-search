services:
  llm-search:
    build: .
    restart: unless-stopped
    ports:
      - "8041:8080"
    environment:
      - KIMI_API_KEY
    volumes:
      # Mount each CLI's home directory (RO) instead of individual files so that
      # atomic-rename token rotations on the host (claude, codex, etc.) are followed.
      # File bind-mounts capture the inode at startup and do NOT track host renames,
      # which causes container creds to go stale after the next refresh.
      - ~/.claude:/mnt/creds/claude:ro
      - ~/.codex:/mnt/creds/codex:ro
      - ~/.gemini:/mnt/creds/gemini:ro
      - ~/.kimi:/mnt/creds/kimi:ro
      - ~/logs/llm-search:/tmp/llm-search/logs