[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-search"
version = "0.1.0"
description = "OpenAI-compatible web search API wrapping Claude Code, Codex, and Gemini CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "Flask==3.1.3",
    "python-dotenv==1.2.2",
    "sh==2.4.0",
    "gunicorn==26.0.0",
]

[project.scripts]
llm-search = "llm_search.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_search = ["prompts/*.md"]
